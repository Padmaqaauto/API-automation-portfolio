
name: Playwright API Automation CI

on:
  push:
    branches:
      - main
      - feature/ci/cd
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API Automation Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-javascript

    env:
      API_ENDPOINT_REGISTRY_FILE: ${{ vars.API_ENDPOINT_REGISTRY_FILE }}
      API_TEST_DATA_ROOT: ${{ vars.API_TEST_DATA_ROOT }}
      API_SCENARIO_DATA_ROOT: ${{ vars.API_SCENARIO_DATA_ROOT }}
      API_SCHEMA_ROOT: ${{ vars.API_SCHEMA_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-javascript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run API automation tests
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-automation-reports
          path: |
            playwright-javascript/reports/
            playwright-javascript/playwright-report/
            playwright-javascript/test-results/
          if-no-files-found: warn
          retention-days: 30
