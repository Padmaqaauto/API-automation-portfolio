
name: Playwright API Automation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: '30 8 * * 1,4'
      timezone: 'Europe/Stockholm'

permissions:
  contents: read

jobs:
  playwright:
    name: Run API Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: playwright-javascript

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      API_VERSION: ${{ vars.API_VERSION }}
      API_TIMEOUT: ${{ vars.API_TIMEOUT }}
      API_ENDPOINT_REGISTRY_FILE: ${{ vars.API_ENDPOINT_REGISTRY_FILE }}
      API_TEST_DATA_ROOT: ${{ vars.API_TEST_DATA_ROOT }}
      API_SCENARIO_DATA_ROOT: ${{ vars.API_SCENARIO_DATA_ROOT }}
      API_SCHEMA_ROOT: ${{ vars.API_SCHEMA_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-javascript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API automation tests
        run: npm test

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-api-report
          path: playwright-javascript/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish execution summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Playwright API Automation"
            echo ""
            echo "- Execution status: **${RESULT}**"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo ""
            echo "Download the Cucumber HTML report from the workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
